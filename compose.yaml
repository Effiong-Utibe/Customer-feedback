services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-customer_feedback}
      DB_USERNAME: ${DB_USERNAME:-customer_feedback}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "composer install --no-interaction --prefer-dist --no-scripts --no-progress
      && php artisan package:discover
      && php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-customer_feedback}
      POSTGRES_USER: ${DB_USERNAME:-customer_feedback}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "${DB_FORWARD_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  vite:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_HMR_HOST: localhost
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-customer_feedback}
      DB_USERNAME: ${DB_USERNAME:-customer_feedback}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan schedule:work

volumes:
  postgres_data:
  vendor:
  node_modules:
